# Works out what the vinyl records are worth on Discogs and saves it in data/priser.js. Runs every
# hour (and when started by hand under Actions > "Discogs-priser" > Run workflow, or by the page
# when a catalogue number or year is saved), but only looks up what is new, changed on the page,
# or older than 14 days. While it runs, the page shows its progress (only runs on main tell the page).
# Needs two repository secrets: DISCOGS_TOKEN (personal Discogs token) and NILS_KODE (the
# password of nils.westerholt.dk, which the collection and the prices are encrypted with).
name: Discogs-priser

on:
  workflow_dispatch:
    inputs:
      udgave:
        description: "Sat af siden: den plade, der lige er ændret (krypteret)"
        required: false
        default: ""
      stikprove:
        description: "Kun til test: slå kun så mange plader op"
        required: false
        default: ""
      billeder:
        description: "Hvor mange covers der højst hentes (tomt = 150, alle = alle)"
        required: false
        default: ""
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: discogs-priser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  priser:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      # The newest prices on the branch (not the ones from when the run was started), so a run
      # that waited for another one builds on what that one saved.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Slå priser op på Discogs
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          NILS_KODE: ${{ secrets.NILS_KODE }}
          MAX_MINUTTER: "300"
          SEND_TIL_SIDEN: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
          UDGAVE: ${{ inputs.udgave }}
          STIKPROVE: ${{ inputs.stikprove }}
          MAX_BILLEDER: ${{ inputs.billeder }}
        run: node tools/discogs-priser.mjs
      - name: Gem priserne
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/priser.js
          # If the prices file changed meanwhile, this run's copy wins: it started from the newest
          # one and from the values the website had, so it holds everything.
          git diff --cached --quiet || (git commit -m "Opdater Discogs-priser" && git pull --rebase -X theirs && git push)
